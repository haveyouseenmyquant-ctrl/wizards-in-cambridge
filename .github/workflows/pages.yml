# Deploys the browser build to GitHub Pages: viewer source from site/ in the repo plus the generated
# world data (manifest, tiles, collision) from the latest release asset world.tar.gz.
# Keeps large generated binaries out of git history. Triggered by scripts/publish.sh.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch world data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern world.tar.gz --dir /tmp
          tar -xzf /tmp/world.tar.gz -C site
          ls -la site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # s4 (optimisation): from 13:00Z on 10 Nov every deploy hung with an empty 'Current status' until the timeout, with
      # the same artifact that deployed at 12:09Z. Use the current actions (v5, Node 24) and retry the deploy once in
      # the same job (the artifact is reused, nothing is re-uploaded), each attempt capped at 8 min.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 480000
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 480000
